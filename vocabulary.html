<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Daily French 🥖 — Vocabulary</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/vocabulary.css">
  <script src="js/nav.js"></script>
</head>
<body>
  <div id="toast" class="toast"></div>
  <div id="modalWrap" class="modal-wrap">
    <div class="modal">
      <h3 id="modalTitle">New Player</h3>
      <input type="text" id="mInput" maxlength="30" placeholder="Your name" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">
      <div class="modal-actions">
        <button id="btnCancelModal" class="btn-ghost">Cancel</button>
        <button id="btnCreatePlayer" class="btn-primary">Create</button>
      </div>
    </div>
  </div>
  <div id="vocabulary-popup-modal" class="vocab-popup-modal">
    <div class="vocab-popup-content">
      <button class="vocab-popup-close" onclick="closeVocabPopup()">×</button>
      <div id="vocab-popup-body">
">
    <section class="dash-section" id="dash-life"><h2 class="dash-title">🇫🇷 My Life in France</h2><div id="lifeSkillsGrid" class="life-skills-grid"></div></section>
    <section class="dash-section" id="dash-levels"><h2 class="dash-title">🗺️ Journey</h2><div id="journeyMap" class="journey-map"></div></section>
    <section class="dash-section" id="dash-badges"><h2 class="dash-title">🏅 Badges</h2><div id="badgesGrid" class="badges-grid"></div></section>
    <section class="dash-section" id="dash-cameleon"><h2 class="dash-title">🦎 Cameleon</h2><div id="cameleonStage" class="cameleon-stage"></div></section>
    <section class="dash-section" id="dash-history"><h2 class="dash-title">📜 History</h2><div id="historyList" class="history-list"></div></section>
    <section class="dash-section" id="dash-genius"><h2 class="dash-title">🪔 Mon Génie</h2><div id="geniusPanel" class="genius-panel"></div></section>
  </main>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/vocabulary-data.js"></script>
  <script src="js/vocabulary-engine.js"></script>
  <script src="js/emergency-data.js"></script>
  <script src="js/conversation-data.js"></script>
  <script src="js/life-skills-data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/ui-utils.js"></script>
  <script src="js/dashboard.js"></script>
  <script>
    function applyThemePick(t){document.documentElement.setAttribute('data-theme',t);localStorage.setItem('dailyFrench_theme',t);if(typeof toast==='function')toast('Theme: '+t)}
    function applyLangPick(l){localStorage.setItem('dailyFrench_lang',l);if(typeof toast==='function')toast('Language: '+l.toUpperCase())}
    (function(){const t=localStorage.getItem('dailyFrench_theme');if(t)document.documentElement.setAttribute('data-theme',t)})();
    document.addEventListener('DOMContentLoaded',function(){if(typeof initDashboard==='function')initDashboard()});
  </script>
</body>
</html>
