<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Daily French 🥖 — Play</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/quiz.css">
</head>
<body>
  <div id="toast" class="toast"></div>

  <!-- Modal joueur -->
  <div id="modalWrap" class="modal-wrap">
    <div class="modal">
      <h3 id="modalTitle">New Player</h3>
      <input type="text" id="mInput" maxlength="30" placeholder="Your name" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">
      <div class="modal-actions">
        <button id="btnCancelModal" class="btn-ghost" onclick="closeModal()">Cancel</button>
        <button id="btnCreatePlayer" class="btn-primary" onclick="confirmNewPlayer()">Create</button>
      </div>
    </div>
  </div>

  <!-- Popup vocabulaire -->
  <div id="vocabulary-popup-modal" class="vocab-popup-modal">
    <div class="vocab-popup-content">
      <button class="vocab-popup-close" onclick="closeVocabPopup()">×</button>
      <div id="vocab-popup-body"></div>
    </div>
  </div>

  <!-- Hero -->
  <header class="hero">
    <div class="hero-avatar" id="heroAv">🎮<span class="hero-lvl-badge" id="heroLvl">1</span></div>
    <div class="hero-info"><div class="hero-name" id="heroName">Guest</div></div>
    <div class="hero-switch">
      <select id="selPlayer" onchange="if(this.value&&typeof loadPlayer==='function'){loadPlayer(this.value)}"><option value="">Choose a player</option></select>
      <button class="btn-ghost btn-small" onclick="if(typeof openModal==='function')openModal()">+ New</button>
    </div>
    <div class="hero-xp">
      <div class="xp-bar"><div class="xp-fill" id="xpBar" style="width:0%"></div></div>
      <div class="xp-text" id="xpText"><span id="xpNow">0</span> pts · Next: <span id="xpGoal">100</span> pts</div>
    </div>
  </header>

  <!-- Bento -->
  <div class="bento-grid">
    <div class="bento-tile"><div class="bento-num" id="b1">1</div><div class="bento-label">Level</div></div>
    <div class="bento-tile"><div class="bento-num" id="b2">0</div><div class="bento-label">Points</div></div>
    <div class="bento-tile"><div class="bento-num" id="b3">0/20</div><div class="bento-label">Done</div></div>
  </div>

  <!-- MAIN : Quiz - Niveaux visibles directement -->
  <main class="play-main">
    <!-- Mode selector -->
    <div class="mode-selector">
      <button class="mode-btn active" data-mode="mixte" onclick="selectMode('mixte')">Mixed</button>
      <button class="mode-btn" data-mode="qcm" onclick="selectMode('qcm')">QCM</button>
      <button class="mode-btn" data-mode="libre" onclick="selectMode('libre')">Written</button>
    </div>

    <!-- Direction -->
    <div style="text-align:center;margin-bottom:var(--space-lg)">
      <div style="font-size:var(--font-sm);color:var(--muted);margin-bottom:var(--space-sm);font-weight:600">Question direction:</div>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
        <button class="direction-btn active" data-direction="en-first" onclick="selectDirection('en-first')">🇬🇧→🇫🇷 EN First</button>
        <button class="direction-btn" data-direction="fr-first" onclick="selectDirection('fr-first')">🇫🇷→🇬🇧 FR First</button>
        <button class="direction-btn" data-direction="mixed" onclick="selectDirection('mixed')">🔄 Mixed</button>
      </div>
    </div>

    <!-- NIVEAUX (visibles directement) -->
    <h2 class="section-title">🎮 Choose a Level</h2>
    <div id="levelsContainer" class="levels-container"></div>
  </main>

  <!-- Nav bottom -->
  <nav class="nav-bottom">
    <a href="my-life.html" class="nav-item"><span class="nav-icon">🇫🇷</span><span>Life</span></a>
    <a href="play.html" class="nav-item active"><span class="nav-icon">🎮</span><span>Play</span></a>
    <a href="vocabulary.html" class="nav-item"><span class="nav-icon">📚</span><span>Vocab</span></a>
    <a href="settings.html" class="nav-item"><span class="nav-icon">⚙️</span><span>Settings</span></a>
  </nav>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/ui-utils.js"></script>
  <script src="js/data-loader.js"></script>
  <script src="js/vocabulary-data.js"></script>
  <script src="js/vocabulary-engine.js"></script>
  <script src="js/game-engine.js"></script>
  <script src="js/quiz.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (typeof initCore === 'function') initCore();
      if (typeof renderLevelsWhenReady === 'function') renderLevelsWhenReady();
      if (typeof selectMode === 'function') selectMode('mixte');
      if (typeof renderDirectionSelector === 'function') renderDirectionSelector();
    });
  </script>
</body>
</html>
