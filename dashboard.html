<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Daily French 🥖 — My Space</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div id="toast" class="toast"></div>
  <div id="modalWrap" class="modal-wrap">
    <div class="modal">
      <h3 id="modalTitle">New Player</h3>
      <input type="text" id="mInput" maxlength="30" placeholder="Your name" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">
      <div class="modal-actions">
        <button id="btnCancelModal" class="btn-ghost" onclick="closeModal()">Cancel</button>
        <button id="btnCreatePlayer" class="btn-primary" onclick="confirmNewPlayer()">Create</button>
      </div>
    </div>
  </div>
  <div id="vocabulary-popup-modal" class="vocab-popup-modal">
    <div class="vocab-popup-content">
      <button class="vocab-popup-close" onclick="closeVocabPopup()">×</button>
      <div id="vocab-popup-body"></div>
    </div>
  </div>
  <header class="hero">
    <div class="hero-avatar" id="heroAv">?<span class="hero-lvl-badge" id="heroLvl">1</span></div>
    <div class="hero-info">
      <div class="hero-name" id="heroName">Guest</div>
    </div>
    <div class="hero-switch">
      <select id="selPlayer" onchange="if(this.value&&typeof loadPlayer==='function'){loadPlayer(this.value)}">
        <option value="">Choose a player</option>
      </select>
      <button class="btn-ghost btn-small" onclick="if(typeof openModal==='function')openModal()">+ New</button>
    </div>
    <div class="hero-xp">
      <div class="xp-bar"><div class="xp-fill" id="xpBar" style="width:0%"></div></div>
      <div class="xp-text" id="xpText"><span id="xpNow">0</span> pts · Next: <span id="xpGoal">100</span> pts</div>
    </div>
  </header>
  <div class="bento-grid">
    <div class="bento-tile"><div class="bento-num" id="b1">1</div><div class="bento-label">Level</div></div>
    <div class="bento-tile"><div class="bento-num" id="b2">0</div><div class="bento-label">Points</div></div>
    <div class="bento-tile"><div class="bento-num" id="b3">0/20</div><div class="bento-label">Done</div></div>
  </div>
  <main class="dashboard-main">
    <section class="dash-section" id="dash-life">
      <h2 class="dash-title">🇫🇷 My Life in France</h2>
      <div id="lifeSkillsGrid" class="life-skills-grid"></div>
    </section>
    <section class="dash-section" id="dash-levels">
      <h2 class="dash-title">🗺️ Journey</h2>
      <div id="journeyMap" class="journey-map"></div>
    </section>
    <section class="dash-section" id="dash-badges">
      <h2 class="dash-title">🏅 Badges</h2>
      <div id="badgesGrid" class="badges-grid"></div>
    </section>
    <section class="dash-section" id="dash-cameleon">
      <h2 class="dash-title">🦎 Cameleon</h2>
      <div id="cameleonStage" class="cameleon-stage"></div>
    </section>
    <section class="dash-section" id="dash-history">
      <h2 class="dash-title">📜 History</h2>
      <div id="historyList" class="history-list"></div>
    </section>
    <section class="dash-section" id="dash-genius">
      <h2 class="dash-title">🪔 Mon Génie</h2>
      <div id="geniusPanel" class="genius-panel"></div>
    </section>
  </main>

  <!-- ✅ ORDRE CORRECT DES SCRIPTS -->
  <script src="js/config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/ui-utils.js"></script>
  <script src="js/life-skills-data.js"></script>
  <script src="js/data-loader.js"></script>
  <script src="js/vocabulary-data.js"></script>
  <script src="js/vocabulary-engine.js"></script>
  <script src="js/emergency-data.js"></script>
  <script src="js/conversation-data.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/nav.js"></script>

  <script>
    function applyThemePick(t){
      document.documentElement.setAttribute('data-theme',t);
      localStorage.setItem('dailyFrench_theme',t);
      if(typeof toast==='function')toast('Theme: '+t);
    }
    function applyLangPick(l){
      localStorage.setItem('dailyFrench_lang',l);
      if(typeof toast==='function')toast('Language: '+l.toUpperCase());
    }
    (function(){
      const t=localStorage.getItem('dailyFrench_theme');
      if(t)document.documentElement.setAttribute('data-theme',t);
    })();
    document.addEventListener('DOMContentLoaded',function(){
      if(typeof initDashboard==='function')initDashboard();
    });
  </script>
  <div id="debug-console" style="position:fixed;bottom:0;left:0;right:0;background:#000;color:#0f0;font-family:monospace;font-size:12px;padding:10px;max-height:200px;overflow:auto;z-index:9999;">
  <div style="color:#fff;font-weight:bold;border-bottom:1px solid #333;margin-bottom:5px;">DEBUG CONSOLE</div>
</div>
<script>
(function(){
  var debug = document.getElementById('debug-console');
  function log(msg, color) {
    var div = document.createElement('div');
    div.style.color = color || '#0f0';
    div.textContent = '> ' + msg;
    debug.appendChild(div);
    debug.scrollTop = debug.scrollHeight;
  }
  
  window.onerror = function(msg, url, line) {
    log('ERROR: ' + msg + ' (line ' + line + ')', '#f00');
    return false;
  };
  
  // Test si les variables existent
  setTimeout(function(){
    log('DIRECTION_MODES: ' + (typeof DIRECTION_MODES !== 'undefined' ? 'OK' : 'MANQUANT'), typeof DIRECTION_MODES !== 'undefined' ? '#0f0' : '#f00');
    log('EventBus: ' + (typeof EventBus !== 'undefined' ? 'OK' : 'MANQUANT'), typeof EventBus !== 'undefined' ? '#0f0' : '#f00');
    log('gameState: ' + (typeof gameState !== 'undefined' ? 'OK' : 'MANQUANT'), typeof gameState !== 'undefined' ? '#0f0' : '#f00');
    log('LESSONS_DATA: ' + (typeof LESSONS_DATA !== 'undefined' ? 'OK' : 'MANQUANT'), typeof LESSONS_DATA !== 'undefined' ? '#0f0' : '#f00');
    log('QUESTIONS_DB: ' + (typeof QUESTIONS_DB !== 'undefined' ? 'OK' : 'MANQUANT'), typeof QUESTIONS_DB !== 'undefined' ? '#0f0' : '#f00');
    log('DirectionMode: ' + (typeof DirectionMode !== 'undefined' ? 'OK' : 'MANQUANT'), typeof DirectionMode !== 'undefined' ? '#0f0' : '#f00');
    log('PlayerManager: ' + (typeof PlayerManager !== 'undefined' ? 'OK' : 'MANQUANT'), typeof PlayerManager !== 'undefined' ? '#0f0' : '#f00');
  }, 1000);
})();
</script>

</body>
</html>
