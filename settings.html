<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Daily French 🥖 — Settings</title>
  <link rel="stylesheet" href="css/base.css">
  <style>
    .settings-page {
      padding: calc(60px + env(safe-area-inset-top, 0px)) 16px 100px;
      max-width: 600px;
      margin: 0 auto;
    }
    .settings-section {
      background: var(--white);
      border-radius: var(--r);
      padding: var(--space-md);
      margin-bottom: var(--space-md);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }
    .settings-section h2 {
      font-size: var(--font-lg);
      margin-bottom: var(--space-sm);
      color: var(--text);
    }
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-sm) 0;
      border-bottom: 1px solid var(--border);
    }
    .settings-row:last-child { border-bottom: none; }
    .settings-row span {
      font-size: var(--font-sm);
      color: var(--text);
      font-weight: 600;
    }
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: var(--space-md);
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: var(--font-sm);
    }
    .theme-preview {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: inline-block;
      border: 2px solid var(--border);
    }
    .theme-ardoise { background: #4A5568; }
    .theme-mauve { background: #7C3AED; }
    .theme-terra { background: #9A3412; }
  </style>
  <script src="js/nav.js"></script>
</head>
<body>

  <div class="settings-page">
    <a href="#" class="btn-back" onclick="history.back(); return false;">← Back</a>
    <h1 class="page-title">⚙️ Settings</h1>

    <!-- THEME -->
    <div class="settings-section">
      <h2>🎨 Theme</h2>
      <div class="settings-row">
        <span><span class="theme-preview theme-ardoise"></span> Ardoise</span>
        <button class="btn-ghost btn-small" onclick="applyThemePick('ardoise')">Select</button>
      </div>
      <div class="settings-row">
        <span><span class="theme-preview theme-mauve"></span> Mauve</span>
        <button class="btn-ghost btn-small" onclick="applyThemePick('mauve')">Select</button>
      </div>
      <div class="settings-row">
        <span><span class="theme-preview theme-terra"></span> Terra Cotta</span>
        <button class="btn-ghost btn-small" onclick="applyThemePick('terra')">Select</button>
      </div>
    </div>

    <!-- DIRECTION -->
    <div class="settings-section">
      <h2>🌐 Question Direction</h2>
      <div class="settings-row">
        <span>🇬🇧 English → 🇫🇷 French</span>
        <button class="btn-ghost btn-small" onclick="applyDirectionPick('en-first')">Select</button>
      </div>
      <div class="settings-row">
        <span>🇫🇷 French → 🇬🇧 English</span>
        <button class="btn-ghost btn-small" onclick="applyDirectionPick('fr-first')">Select</button>
      </div>
      <div class="settings-row">
        <span>🔄 Mixed</span>
        <button class="btn-ghost btn-small" onclick="applyDirectionPick('mixed')">Select</button>
      </div>
    </div>

    <!-- PER-MODULE DIRECTION (pour utilisateurs avancés) -->
    <div class="settings-section">
      <h2>🔧 Advanced — Per Module</h2>
      <div class="settings-row">
        <span>Quiz Direction</span>
        <select id="quizDirection" onchange="saveModuleDirection('quiz', this.value)">
          <option value="global">Use global</option>
          <option value="en-first">EN→FR</option>
          <option value="fr-first">FR→EN</option>
          <option value="mixed">Mixed</option>
        </select>
      </div>
      <div class="settings-row">
        <span>Lessons Direction</span>
        <select id="lessonsDirection" onchange="saveModuleDirection('lessons', this.value)">
          <option value="global">Use global</option>
          <option value="en-first">EN→FR</option>
          <option value="fr-first">FR→EN</option>
        </select>
      </div>
      <div class="settings-row">
        <span>SOS Direction</span>
        <select id="sosDirection" onchange="saveModuleDirection('sos', this.value)">
          <option value="global">Use global</option>
          <option value="en-first">EN→FR</option>
          <option value="fr-first">FR→EN</option>
        </select>
      </div>
    </div>

    <!-- PROFILE -->
    <div class="settings-section">
      <h2>💾 Profile</h2>
      <div class="settings-row">
        <span>Export backup</span>
        <button class="btn-ghost btn-small" onclick="doExport()">Export</button>
      </div>
      <div class="settings-row">
        <span>Import backup</span>
        <input type="file" id="importFile" accept=".json" onchange="doImport(event)" style="display:none;">
        <button class="btn-ghost btn-small" onclick="document.getElementById('importFile').click()">Import</button>
      </div>
    </div>

    <!-- ABOUT -->
    <div class="settings-section">
      <h2>ℹ️ About</h2>
      <div class="settings-row">
        <span>Version</span>
        <span style="color:var(--muted);font-size:var(--font-sm);">v3.0</span>
      </div>
      <div class="settings-row">
        <span>Storage used</span>
        <span id="storageUsed" style="color:var(--muted);font-size:var(--font-sm);">—</span>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/core.js"></script>
  <script>
    // Restore settings
    (function() {
      const savedTheme = localStorage.getItem('dailyFrench_theme');
      if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);

      const savedDir = localStorage.getItem('dailyFrench_direction') || 'en-first';
      document.getElementById('quizDirection').value = localStorage.getItem('dailyFrench_direction_quiz') || 'global';
      document.getElementById('lessonsDirection').value = localStorage.getItem('dailyFrench_direction_lessons') || 'global';
      document.getElementById('sosDirection').value = localStorage.getItem('dailyFrench_direction_sos') || 'global';

      // Storage usage
      let total = 0;
      for (let key in localStorage) {
        if (localStorage.hasOwnProperty(key)) total += localStorage[key].length * 2;
      }
      document.getElementById('storageUsed').textContent = (total / 1024).toFixed(1) + ' KB';
    })();

    function saveModuleDirection(module, value) {
      localStorage.setItem('dailyFrench_direction_' + module, value);
      toast(module + ' direction saved: ' + value);
    }
  </script>
</body>
</html>
