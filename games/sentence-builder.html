<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Daily French 🥖 — Phrase Builder 🧩</title>
  <script src="../js/theme-loader.js"></script>
  <link rel="stylesheet" href="../css/base.css">
  <script src="../js/nav.js"></script>
  <style>
    /* ── Layout ─────────────────────────────────────────────────── */
    .phrase-container{max-width:900px;margin:0 auto;padding:var(--space-md)}
    .phrase-header{text-align:center;margin-bottom:var(--space-lg)}
    .phrase-header h1{font-size:var(--font-xl);font-weight:800;color:var(--primary)}
    .phrase-header p{color:var(--muted);font-size:var(--font-sm)}

    /* ── Mission Box ────────────────────────────────────────────── */
    .mission-box{background:var(--primary-light);border-radius:var(--r);padding:var(--space-lg);margin-bottom:var(--space-lg);text-align:center;position:relative}
    .mission-level-badge{position:absolute;top:8px;right:12px;background:var(--primary);color:#fff;font-size:var(--font-xs);font-weight:700;padding:4px 10px;border-radius:var(--r-sm)}
    .mission-emoji{font-size:2.5em;margin-bottom:var(--space-sm)}
    .mission-text{font-size:var(--font-md);font-weight:700;color:var(--text)}
    .mission-hint{color:var(--muted);font-size:var(--font-sm);font-style:italic;margin-top:var(--space-sm)}

    /* ── Blocks Pool ────────────────────────────────────────────── */
    .blocks-pool{display:flex;flex-wrap:wrap;gap:var(--space-sm);margin-bottom:var(--space-lg);min-height:60px;padding:var(--space-md);background:var(--bg-card);border-radius:var(--r);border:2px dashed var(--border)}
    .block{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;background:var(--white);border:2px solid var(--primary);border-radius:var(--r-sm);font-weight:700;color:var(--text);cursor:grab;transition:all .2s;user-select:none;touch-action:manipulation}
    .block:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
    .block.dragging{opacity:.4;transform:scale(1.05)}
    .block.used{opacity:.3;pointer-events:none;filter:grayscale(1)}
    .block:active{cursor:grabbing}

    /* ── Drop Zone ────────────────────────────────────────────── */
    .drop-zone{display:flex;flex-wrap:wrap;gap:var(--space-sm);min-height:70px;padding:var(--space-md);background:var(--white);border:3px dashed var(--border);border-radius:var(--r);align-items:center;justify-content:center;margin-bottom:var(--space-lg);transition:all .3s ease}
    .drop-zone.drag-over{background:var(--primary-light);border-color:var(--primary);transform:scale(1.01)}
    .drop-zone.correct{background:#d1fae5;border-color:#059669;box-shadow:0 0 20px rgba(5,150,105,.3)}
    .drop-zone.incorrect{background:#fee2e2;border-color:#dc2626}
    .drop-zone.shake{animation:shake .5s ease-in-out}
    @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
    .drop-placeholder{color:var(--muted);font-style:italic;font-size:var(--font-sm)}

    /* ── Slots (dropped blocks) ───────────────────────────────── */
    .slot{display:inline-flex;align-items:center;justify-content:center;min-width:80px;min-height:50px;padding:10px 16px;background:var(--bg-card);border:2px dashed var(--border);border-radius:var(--r-sm);cursor:pointer;transition:all .2s;font-weight:600}
    .slot.filled{border-style:solid;border-color:var(--primary);background:var(--white);color:var(--text)}
    .slot.filled:hover{background:#fee2e2;border-color:#dc2626;transform:scale(1.05)}
    .slot.filled::after{content:'×';margin-left:6px;font-size:12px;color:var(--muted);opacity:0;transition:opacity .2s}
    .slot.filled:hover::after{opacity:1}

    /* ── Controls ─────────────────────────────────────────────── */
    .controls{display:flex;gap:var(--space-sm);justify-content:center;flex-wrap:wrap;margin-bottom:var(--space-md)}
    .controls .btn{padding:12px 24px;font-weight:700}

    /* ── Feedback ─────────────────────────────────────────────── */
    .feedback{display:none;margin-bottom:var(--space-lg);padding:var(--space-lg);border-radius:var(--r);text-align:center;animation:fadeIn .3s ease}
    @keyframes fadeIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
    .feedback-correct{background:#d1fae5;border:2px solid #059669;color:#064e3b}
    .feedback-incorrect{background:#fee2e2;border:2px solid #dc2626;color:#7f1d1d}
    .feedback-icon{font-size:2.5em;margin-bottom:var(--space-sm)}
    .feedback-title{font-size:var(--font-lg);font-weight:800;margin-bottom:var(--space-sm)}
    .feedback-phrase{font-size:var(--font-md);font-weight:700;margin-bottom:var(--space-sm);padding:8px 16px;background:rgba(255,255,255,.6);border-radius:var(--r-sm);display:inline-block}
    .feedback-built{font-size:var(--font-sm);color:var(--muted);margin-bottom:var(--space-sm);text-decoration:line-through}
    .feedback-hint{font-size:var(--font-sm);font-style:italic;margin-bottom:var(--space-sm)}
    .feedback-target{font-size:var(--font-sm);font-weight:700;background:rgba(255,255,255,.6);padding:6px 12px;border-radius:var(--r-sm);display:inline-block}
    .feedback-message{font-size:var(--font-sm);margin:var(--space-sm) 0}
    .feedback-points{font-size:var(--font-md);font-weight:800;color:var(--primary);margin-top:var(--space-sm)}

    /* ── Score Board ──────────────────────────────────────────── */
    .score-board{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-sm);margin-bottom:var(--space-lg)}
    .score-item{background:var(--bg-card);border-radius:var(--r);padding:var(--space-sm);text-align:center;transition:transform .2s}
    .score-item:hover{transform:translateY(-2px)}
    .score-num{font-size:var(--font-xl);font-weight:800;color:var(--primary)}
    .score-label{font-size:var(--font-xs);color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

    /* ── Level Select ─────────────────────────────────────────── */
    .level-select{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:var(--space-lg);padding:var(--space-md);background:var(--bg-card);border-radius:var(--r)}
    .lvl-btn{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 16px;border:2px solid var(--border);background:var(--white);border-radius:var(--r-sm);cursor:pointer;font-weight:700;font-size:var(--font-sm);transition:all .2s;min-width:100px}
    .lvl-btn:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
    .lvl-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
    .lvl-btn.completed{background:#d1fae5;border-color:#059669;color:#064e3b}
    .lvl-btn .lvl-num{font-size:var(--font-xs);opacity:.7}
    .lvl-btn .lvl-title{font-size:var(--font-sm)}
    .lvl-btn .lvl-check{position:absolute;top:-6px;right:-6px;background:#059669;color:#fff;width:20px;height:20px;border-radius:50%;font-size:12px;display:flex;align-items:center;justify-content:center}
    .lvl-btn .lvl-score{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;font-size:10px;padding:2px 8px;border-radius:10px}

    /* ── Level Complete Overlay ───────────────────────────────── */
    .level-complete{text-align:center;padding:var(--space-xl)}
    .level-complete-emoji{font-size:4em;margin-bottom:var(--space-md)}
    .level-complete-title{font-size:var(--font-xl);font-weight:800;color:var(--primary);margin-bottom:var(--space-sm)}
    .level-complete-text{color:var(--muted);margin-bottom:var(--space-lg)}
  </style>
</head>
<body>
  <div id="toast" class="toast"></div>
  <div id="modalWrap" class="modal-wrap">
    <div class="modal">
      <h3 id="modalTitle">New Player</h3>
      <input type="text" id="mInput" maxlength="30" placeholder="Your name" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">
      <div class="modal-actions">
        <button id="btnCancelModal" class="btn-ghost" onclick="closeModal()">Cancel</button>
        <button id="btnCreatePlayer" class="btn-primary" onclick="confirmNewPlayer()">Create</button>
      </div>
    </div>
  </div>
  <header class="hero">
    <div class="hero-avatar" id="heroAv">🧩<span class="hero-lvl-badge" id="heroLvl">1</span></div>
    <div class="hero-info"><div class="hero-name" id="heroName">Guest</div></div>
    <div class="hero-xp">
      <div class="xp-bar"><div class="xp-fill" id="xpBar" style="width:0%"></div></div>
      <div class="xp-text" id="xpText"><span id="xpNow">0</span> pts · Next: <span id="xpGoal">100</span> pts</div>
    </div>
    <div class="hero-switch">
      <select id="selPlayer" onchange="if(this.value&&typeof loadPlayer==='function'){loadPlayer(this.value)}"><option value="">Choose a player</option></select>
      <button class="btn-ghost btn-small" onclick="if(typeof openModal==='function')openModal()">+ New</button>
    </div>
  </header>
  <div class="bento-grid">
    <div class="bento-tile"><div class="bento-num" id="b1">1</div><div class="bento-label">Level</div></div>
    <div class="bento-tile"><div class="bento-num" id="b2">0</div><div class="bento-label">Points</div></div>
    <div class="bento-tile"><div class="bento-num" id="b3">0/80</div><div class="bento-label">Done</div></div>
  </div>
  <div class="phrase-container">
    <div class="phrase-header">
      <h1>🧩 Phrase Builder</h1>
      <p>Drag or tap blocks • Build sentences • Learn grammar by doing</p>
    </div>
    <div class="score-board">
      <div class="score-item"><div class="score-num" id="scoreTotal">0</div><div class="score-label">Points</div></div>
      <div class="score-item"><div class="score-num" id="scoreStreak">0</div><div class="score-label">Streak 🔥</div></div>
      <div class="score-item"><div class="score-num" id="scoreCompleted">0</div><div class="score-label">Phrases</div></div>
    </div>
    <div class="level-select" id="levelSelect"></div>
    <div class="mission-box" id="missionBox">
      <span class="mission-level-badge" id="missionLevelBadge">Level 1</span>
      <div class="mission-emoji" id="missionEmoji">🎯</div>
      <div class="mission-text" id="missionText">Loading...</div>
      <div class="mission-hint" id="missionHint"></div>
    </div>
    <div class="blocks-pool" id="blocksPool"></div>
    <div class="drop-zone" id="dropZone"><span class="drop-placeholder">👇 Drag or tap blocks to build your phrase</span></div>
    <div class="controls">
      <button class="btn btn-primary" onclick="checkPhrase()">✓ Check</button>
      <button class="btn btn-ghost" onclick="clearPhrase()">✕ Clear</button>
      <button class="btn btn-secondary" onclick="showHint()">💡 Hint</button>
      <button class="btn btn-ghost" onclick="speakPhrase()">🔊 Listen</button>
    </div>
    <div class="feedback" id="feedback" style="display:none"></div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/core.js"></script>
  <script src="../js/ui-utils.js"></script>
  <script src="js/games/sentence-builder-data.js"></script>
  <script src="games/js/sentence-builder.js"></script>
</body>
</html>
