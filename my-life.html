<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Daily French 🥖 — My Life in France</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/my-life.css">
</head>
<body>
  <div id="toast" class="toast"></div>

  <!-- Modal joueur -->
  <div id="modalWrap" class="modal-wrap">
    <div class="modal">
      <h3 id="modalTitle">New Player</h3>
      <input type="text" id="mInput" maxlength="30" placeholder="Your name" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">
      <div class="modal-actions">
        <button id="btnCancelModal" class="btn-ghost" onclick="closeModal()">Cancel</button>
        <button id="btnCreatePlayer" class="btn-primary" onclick="confirmNewPlayer()">Create</button>
      </div>
    </div>
  </div>

  <!-- Popup vocabulaire -->
  <div id="vocabulary-popup-modal" class="vocab-popup-modal">
    <div class="vocab-popup-content">
      <button class="vocab-popup-close" onclick="closeVocabPopup()">×</button>
      <div id="vocab-popup-body"></div>
    </div>
  </div>

  <!-- Hero -->
  <header class="hero mylife-hero">
    <div class="hero-avatar" id="heroAv">🇫🇷<span class="hero-lvl-badge" id="heroLvl">1</span></div>
    <div class="hero-info">
      <div class="hero-name" id="heroName">Guest</div>
    </div>
    <div class="hero-switch">
      <select id="selPlayer" onchange="if(this.value&&typeof loadPlayer==='function'){loadPlayer(this.value)}"><option value="">Choose a player</option></select>
      <button class="btn-ghost btn-small" onclick="if(typeof openModal==='function')openModal()">+ New</button>
    </div>
    <div class="hero-xp">
      <div class="xp-bar"><div class="xp-fill" id="xpBar" style="width:0%"></div></div>
      <div class="xp-text" id="xpText"><span id="xpNow">0</span> pts · Next: <span id="xpGoal">100</span> pts</div>
    </div>
  </header>

  <!-- Bento -->
  <div class="bento-grid">
    <div class="bento-tile"><div class="bento-num" id="b1">1</div><div class="bento-label">Level</div></div>
    <div class="bento-tile"><div class="bento-num" id="b2">0</div><div class="bento-label">Points</div></div>
    <div class="bento-tile"><div class="bento-num" id="b3">0/3</div><div class="bento-label">Done</div></div>
  </div>

  <!-- MAIN -->
  <main class="mylife-main">
    <h2 class="mylife-title">🇫🇷 My Life in France</h2>
    <p class="mylife-subtitle">Practise real-life situations: bakery, doctor, shopping, restaurant...</p>

    <!-- Grille des compétences -->
    <div id="lifeSkillsGrid" class="life-skills-grid"></div>

    <!-- Simulateur -->
    <div id="simulatorArea" class="simulator-area" style="display:none">
      <div class="sim-header">
        <button class="btn btn-ghost btn-small" onclick="backToSkills()">← Back</button>
        <span id="simTitle">Scenario</span>
      </div>
      <div id="simDialogue" class="sim-dialogue"></div>
      <div id="simChoices" class="sim-choices"></div>
      <div id="simFeedback" class="sim-feedback" style="display:none">
        <div id="simFeedbackText"></div>
        <button id="simNextBtn" class="btn btn-primary">Continue</button>
      </div>
    </div>

    <!-- Résultats -->
    <div id="simResults" class="sim-results" style="display:none">
      <div class="sim-result-circle"><div id="simResultScore">0%</div></div>
      <h3 id="simResultTitle">Results</h3>
      <p id="simResultMsg"></p>
      <div class="sim-result-actions">
        <button class="btn btn-secondary" onclick="backToSkills()">← Back to Skills</button>
        <button class="btn btn-primary" onclick="retryScenario()">Retry</button>
      </div>
    </div>
  </main>

  <!-- PAS DE NAV ICI — injectée par nav.js -->

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/ui-utils.js"></script>
  <script src="js/life-skills-data.js"></script>
  <script src="js/my-life.js"></script>
  <script src="js/nav.js"></script>

</body>
</html>
