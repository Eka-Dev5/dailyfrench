<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Daily French 🥖 — My Space</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <div id="toast" class="toast"></div>

  <!-- Modal joueur -->
  <div id="modalWrap" class="modal-wrap">
    <div class="modal">
      <h3 id="modalTitle">New Player</h3>
      <input type="text" id="mInput" maxlength="30" placeholder="Your name"
        autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">
      <div class="modal-actions">
        <button id="btnCancelModal" class="btn-ghost">Cancel</button>
        <button id="btnCreatePlayer" class="btn-primary">Create</button>
      </div>
    </div>
  </div>

  <!-- Popup vocabulaire — CORRIGÉ Juin 2026 -->
  <div id="vocabulary-popup-modal" class="vocab-popup-modal">
    <div class="vocab-popup-content">
      <button class="vocab-popup-close" onclick="closeVocabPopup()">×</button>
      <div id="vocab-popup-body"></div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════════
       NAVIGATION TOP — Barre du haut (NOUVEAU — Juin 2026)
       Liens vers les pages annexes : SOS, Talk, Jeux, Config
       Ordre : Urgence → Communication → Jeux → Paramètres
       ═══════════════════════════════════════════════════════════════════ -->
  <nav class="nav-top">
    <a href="emergency.html" class="nav-top-item">
      <span class="nav-top-icon">🚨</span>SOS
    </a>
    <a href="conversation.html" class="nav-top-item">
      <span class="nav-top-icon">💬</span>Talk
    </a>
    <a href="games/listen.html" class="nav-top-item">
      <span class="nav-top-icon">🎧</span>Listen
    </a>
    <a href="games/phrase-builder.html" class="nav-top-item">
      <span class="nav-top-icon">🧩</span>Phrase
    </a>
    <a href="dashboard.html" class="nav-top-item active">
      <span class="nav-top-icon">⚙️</span>Config
    </a>
  </nav>

  <!-- ═══════════════════════════════════════════════════════════════════
       NAVIGATION BOTTOM — Navigation principale
       MODIFIÉ Juin 2026 :
       - "Home" renommé en "Start" (page d'accueil quiz.html)
       - "Space" renommé en "Dashboard" (cette page)
       - "hero-tag" supprimé (doublon avec bento tiles)
       ═══════════════════════════════════════════════════════════════════ -->
  <nav class="nav-bottom">
    <a href="quiz.html" class="nav-item">
      <span class="nav-icon">🏠</span><span>Start</span>
    </a>
    <a href="quiz.html?section=lecons" class="nav-item">
      <span class="nav-icon">📚</span><span>Lessons</span>
    </a>
    <a href="quiz.html?section=levels" class="nav-item">
      <span class="nav-icon">🎮</span><span>Play</span>
    </a>
    <a href="vocabulary.html" class="nav-item">
      <span class="nav-icon">📖</span><span>Vocab</span>
    </a>
    <a href="dashboard.html" class="nav-item active">
      <span class="nav-icon">📊</span><span>Dashboard</span>
    </a>
  </nav>

  <!-- HERO — hero-tag supprimé (doublon avec bento tiles) -->
  <header class="hero">
    <div class="hero-avatar" id="heroAv">?<span class="hero-lvl-badge" id="heroLvl">1</span></div>
    <div class="hero-info">
      <div class="hero-name" id="heroName">Guest</div>
      <!-- hero-tag SUPPRIMÉ — les infos Level/Points/Done sont dans les bento tiles -->
    </div>
    <div class="hero-xp">
      <div class="xp-bar"><div class="xp-fill" id="xpBar" style="width:0%"></div></div>
      <div class="xp-text" id="xpText">
        <span id="xpNow">0</span> pts · Next: <span id="xpGoal">100</span> pts
      </div>
    </div>
    <div class="hero-switch">
      <select id="selPlayer" onchange="if(this.value&&typeof loadPlayer==='function'){loadPlayer(this.value)}">
        <option value="">Choose a player</option>
      </select>
      <button class="btn-ghost btn-small" onclick="if(typeof openModal==='function')openModal()">+ New</button>
      <button class="btn-settings" onclick="toggleSettings()" title="Settings" aria-label="Settings">⚙️</button>
    </div>
    <!-- Panel settings flottant -->
    <div id="settingsPanel" class="settings-panel" style="display:none;">
      <div class="settings-row">
        <span>Theme</span>
        <div class="theme-dots">
          <button class="theme-dot" data-theme="ardoise" onclick="applyThemePick('ardoise')" title="Ardoise">🌑</button>
          <button class="theme-dot" data-theme="mauve"   onclick="applyThemePick('mauve')"   title="Mauve">🟣</button>
          <button class="theme-dot" data-theme="terra"   onclick="applyThemePick('terra')"   title="Terra">🟤</button>
        </div>
      </div>
      <div class="settings-row">
        <span>Interface</span>
        <div class="lang-btns">
          <button onclick="applyLangPick('en')">🇬🇧 EN</button>
          <button onclick="applyLangPick('fr')">🇫🇷 FR</button>
        </div>
      </div>
    </div>
  </header>

  <!-- BENTO — identique sur toutes les pages -->
  <div class="bento-grid">
    <div class="bento-tile">
      <div class="bento-num" id="b1">1</div>
      <div class="bento-label">Level</div>
    </div>
    <div class="bento-tile">
      <div class="bento-num" id="b2">0</div>
      <div class="bento-label">Points</div>
    </div>
    <div class="bento-tile">
      <div class="bento-num" id="b3">0/20</div>
      <div class="bento-label">Done</div>
    </div>
  </div>

  <!-- QUICK ACCESS BAR — SUPPRIMÉ Juin 2026
       Les liens SOS et Conversations sont maintenant dans la nav-top.
       Cette barre est donc devenue inutile.
  -->

  <main class="dashboard-main">
    <section class="dash-section" id="dash-life">
      <h2 class="dash-title">🇫🇷 My Life in France</h2>
      <div id="lifeSkillsGrid" class="life-skills-grid"></div>
    </section>
    <section class="dash-section" id="dash-levels">
      <h2 class="dash-title">🗺️ Journey</h2>
      <div id="journeyMap" class="journey-map"></div>
    </section>
    <section class="dash-section" id="dash-badges">
      <h2 class="dash-title">🏅 Badges</h2>
      <div id="badgesGrid" class="badges-grid"></div>
    </section>
    <section class="dash-section" id="dash-cameleon">
      <h2 class="dash-title">🦎 Cameleon</h2>
      <div id="cameleonStage" class="cameleon-stage"></div>
    </section>
    <section class="dash-section" id="dash-history">
      <h2 class="dash-title">📜 History</h2>
      <div id="historyList" class="history-list"></div>
    </section>
    <section class="dash-section" id="dash-genius">
      <h2 class="dash-title">🪔 Mon Génie</h2>
      <div id="geniusPanel" class="genius-panel"></div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/vocabulary-data.js"></script>
  <script src="js/vocabulary-engine.js"></script>
  <script src="js/emergency-data.js"></script>
  <script src="js/conversation-data.js"></script>
  <script src="js/life-skills-data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/ui-utils.js"></script>
  <script src="js/dashboard.js"></script>

</body>
</html>
