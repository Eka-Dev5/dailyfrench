<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Daily French 🥖 — Vocabulary</title>

  <link rel="stylesheet" href="css/vocabulary.css">
</head>
<body>

  <!-- Modal joueur -->
  <div id="modalWrap" class="modal-wrap">
    <div class="modal">
      <h3 id="modalTitle">New Player</h3>
      <input type="text" id="mInput" maxlength="30" placeholder="Your name"
        autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">
      <div class="modal-actions">
        <button id="btnCancelModal" class="btn-ghost">Cancel</button>
        <button id="btnCreatePlayer" class="btn-primary">Create</button>
      </div>
    </div>
  </div>

  <!-- Popup vocabulaire — CORRIGÉ Juin 2026 -->
  <div id="vocabulary-popup-modal" class="vocab-popup-modal">
    <div class="vocab-popup-content">
      <button class="vocab-popup-close" onclick="closeVocabPopup()">×</button>
      <div id="vocab-popup-body">
        <div class="vocab-popup-fr" id="vocabPopupFr"></div>
        <div class="vocab-popup-phon" id="vocabPopupPhon"></div>
        <div class="vocab-popup-en" id="vocabPopupEn"></div>
        <div class="vocab-popup-def" id="vocabPopupDef"></div>
        <div class="vocab-popup-ex" id="vocabPopupEx"></div>
        <div class="vocab-popup-cat" id="vocabPopupCat"></div>
      </div>
    </div>
  </div>

  <!-- NAVIGATION TOP -->
  <nav class="nav-top">
    <a href="emergency.html" class="nav-top-item">
      <span class="nav-top-icon">🚨</span>SOS
    </a>
    <a href="conversation.html" class="nav-top-item">
      <span class="nav-top-icon">💬</span>Talk
    </a>
    <a href="games/listen.html" class="nav-top-item">
      <span class="nav-top-icon">🎧</span>Listen
    </a>
    <a href="games/phrase-builder.html" class="nav-top-item">
      <span class="nav-top-icon">🧩</span>Phrase
    </a>
    <a href="dashboard.html" class="nav-top-item">
      <span class="nav-top-icon">⚙️</span>Config
    </a>
  </nav>

  <!-- NAVIGATION BOTTOM -->
  <nav class="nav-bottom">
    <a href="quiz.html" class="nav-item">
      <span class="nav-icon">🏠</span><span>Start</span>
    </a>
    <a href="quiz.html?section=lecons" class="nav-item">
      <span class="nav-icon">📚</span><span>Lessons</span>
    </a>
    <a href="quiz.html?section=levels" class="nav-item">
      <span class="nav-icon">🎮</span><span>Play</span>
    </a>
    <a href="vocabulary.html" class="nav-item active">
      <span class="nav-icon">📖</span><span>Vocab</span>
    </a>
    <a href="dashboard.html" class="nav-item">
      <span class="nav-icon">📊</span><span>Dashboard</span>
    </a>
  </nav>

  <!-- HERO -->
  <header class="hero">
    <div class="hero-avatar" id="heroAv">?<span class="hero-lvl-badge" id="heroLvl">1</span></div>
    <div class="hero-info">
      <div class="hero-name" id="heroName">Guest</div>
    </div>
    <div class="hero-xp">
      <div class="xp-bar"><div class="xp-fill" id="xpBar" style="width:0%"></div></div>
      <div class="xp-text" id="xpText">
        <span id="xpNow">0</span> pts · Next: <span id="xpGoal">100</span> pts
      </div>
    </div>
    <div class="hero-switch">
      <select id="selPlayer" onchange="if(this.value&&typeof loadPlayer==='function'){loadPlayer(this.value)}">
        <option value="">Choose a player</option>
      </select>
      <button class="btn-ghost btn-small" onclick="if(typeof openModal==='function')openModal()">+ New</button>
      <button class="btn-settings" onclick="toggleSettings()" title="Settings" aria-label="Settings">⚙️</button>
    </div>
    <div id="settingsPanel" class="settings-panel" style="display:none;">
      <div class="settings-row">
        <span>Theme</span>
        <div class="theme-dots">
          <button class="theme-dot" data-theme="ardoise" onclick="applyThemePick('ardoise')">🌑</button>
          <button class="theme-dot" data-theme="mauve" onclick="applyThemePick('mauve')">🟣</button>
          <button class="theme-dot" data-theme="terra" onclick="applyThemePick('terra')">🟤</button>
        </div>
      </div>
      <div class="settings-row">
        <span>Interface</span>
        <div class="lang-btns">
          <button onclick="applyLangPick('en')">🇬🇧 EN</button>
          <button onclick="applyLangPick('fr')">🇫🇷 FR</button>
        </div>
      </div>
      <!-- NOUVEAU v2.1 : Toggle carte FR/EN -->
      <div class="settings-row">
        <span>Cards</span>
        <div class="lang-btns">
          <button id="vocabCardModeFr" onclick="setVocabCardMode('fr')" class="active">🇫🇷 FR First</button>
          <button id="vocabCardModeEn" onclick="setVocabCardMode('en')">🇬🇧 EN First</button>
        </div>
      </div>
    </div>
  </header>

  <!-- BENTO -->
  <div class="bento-grid">
    <div class="bento-tile">
      <div class="bento-num" id="b1">1</div>
      <div class="bento-label">Level</div>
    </div>
    <div class="bento-tile">
      <div class="bento-num" id="b2">0</div>
      <div class="bento-label">Points</div>
    </div>
    <div class="bento-tile">
      <div class="bento-num" id="b3">0/20</div>
      <div class="bento-label">Done</div>
    </div>
  </div>

  <!-- SECTION VOCABULAIRE -->
  <section id="vocabSection" class="section active">
    <h2 class="section-title">📖 Vocabulary</h2>
    <div class="vocab-toolbar">
      <input type="text" id="vocabSearch" placeholder="Search French or English…"
        autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">
      <select id="vocabFilterLevel">
        <option value="">All levels</option>
      </select>
      <select id="vocabFilterCat">
        <option value="">All categories</option>
      </select>
    </div>
    <div class="vocab-meta"><span id="vocabCount">0</span> words</div>
    <div id="vocabGrid" class="vocab-grid"></div>
  </section>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/vocabulary-data.js"></script>
  <script src="js/vocabulary-engine.js"></script>
  <script src="js/core.js"></script>
  <script src="js/ui-utils.js"></script>
  <script src="js/vocabulary.js"></script>

  <!-- NOUVEAU v2.1 : Script pour le mode carte -->
  <script>
    // Mode d'affichage des cartes : 'fr' (FR first) ou 'en' (EN first)
    let vocabCardMode = localStorage.getItem('dailyFrench_vocabCardMode') || 'fr';
    
    function setVocabCardMode(mode) {
      vocabCardMode = mode;
      localStorage.setItem('dailyFrench_vocabCardMode', mode);
      
      // Met à jour les boutons
      document.getElementById('vocabCardModeFr').classList.toggle('active', mode === 'fr');
      document.getElementById('vocabCardModeEn').classList.toggle('active', mode === 'en');
      
      // Re-render la grille
      const grid = document.getElementById('vocabGrid');
      const search = document.getElementById('vocabSearch');
      const levelSel = document.getElementById('vocabFilterLevel');
      const catSel = document.getElementById('vocabFilterCat');
      
      if (grid && typeof renderVocabularyList === 'function') {
        renderVocabularyList(grid, {
          query: search ? search.value : '',
          level: levelSel ? levelSel.value : '',
          category: catSel ? catSel.value : ''
        });
      }
      
      toast('Card mode: ' + (mode === 'fr' ? '🇫🇷 French First' : '🇬🇧 English First'));
    }
    
    // Init au chargement
    document.addEventListener('DOMContentLoaded', function() {
      setVocabCardMode(vocabCardMode);
    });
    
    // Override renderVocabularyList pour supporter le mode carte
    const originalRenderVocabularyList = renderVocabularyList;
    renderVocabularyList = function(container, filters) {
      if (!container || typeof VOCABULARY_BDD === 'undefined') return;
      
      let list = VOCABULARY_BDD.slice();
      if (filters) {
        const q = (filters.query || '').trim().toLowerCase();
        const lvl = filters.level;
        const cat = filters.category;
        if (q) list = list.filter(v => 
          (v.fr || '').toLowerCase().includes(q) || 
          (v.en || '').toLowerCase().includes(q) || 
          (v.def || '').toLowerCase().includes(q)
        );
        if (lvl) list = list.filter(v => v.level === parseInt(lvl, 10));
        if (cat) list = list.filter(v => v.cat === cat);
      }
      
      const countEl = document.getElementById('vocabCount');
      if (countEl) countEl.textContent = list.length;
      
      container.innerHTML = '';
      if (!list.length) {
        container.innerHTML = '<div class="empty-state">No words match your search.</div>';
        return;
      }
      
      list.forEach(entry => {
        const card = document.createElement('div');
        card.className = 'vocab-card';
        
        // Ordre selon le mode
        const showFrFirst = vocabCardMode === 'fr';
        
        card.innerHTML = `
          <div class="vocab-${showFrFirst ? 'fr' : 'en'}" style="font-size:1.2em;font-weight:600;">
            ${_esc(showFrFirst ? entry.fr : entry.en)}
          </div>
          <div class="vocab-${showFrFirst ? 'en' : 'fr'}" style="font-size:0.95em;opacity:0.8;">
            ${_esc(showFrFirst ? entry.en : entry.fr)}
          </div>
          ${entry.phon ? '<div class="vocab-phon">' + _esc(entry.phon) + '</div>' : ''}
          <div>
            ${entry.cat ? '<span class="vocab-cat">' + _esc(entry.cat) + '</span>' : ''}
            ${entry.level ? '<span class="vocab-lvl">Lvl ' + entry.level + '</span>' : ''}
          </div>
        `;
        
        card.addEventListener('click', () => { 
          if (typeof openVocabPopup === 'function') openVocabPopup(entry.fr); 
        });
        container.appendChild(card);
      });
    };
  </script>

</body>
</html>
