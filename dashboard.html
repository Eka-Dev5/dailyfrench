<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Daily French 🥖 — My Space</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <!-- Toast notification -->
  <div id="toast" class="toast"></div>
  
  <!-- Modal pour créer un joueur -->
  <div id="modalWrap" class="modal-wrap">
    <div class="modal">
      <h3 id="modalTitle">New Player</h3>
      <input type="text" id="mInput" maxlength="30" placeholder="Your name" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">
      <div class="modal-actions">
        <button id="btnCancelModal" class="btn-ghost" onclick="closeModal()">Cancel</button>
        <button id="btnCreatePlayer" class="btn-primary" onclick="confirmNewPlayer()">Create</button>
      </div>
    </div>
  </div>
  
  <!-- Modal popup vocabulaire -->
  <div id="vocabulary-popup-modal" class="vocab-popup-modal">
    <div class="vocab-popup-content">
      <button class="vocab-popup-close" onclick="closeVocabPopup()">×</button>
      <div id="vocab-popup-body"></div>
    </div>
  </div>
  
  <!-- Hero header (joueur + XP) -->
  <header class="hero">
    <div class="hero-avatar" id="heroAv">?<span class="hero-lvl-badge" id="heroLvl">1</span></div>
    <div class="hero-info">
      <div class="hero-name" id="heroName">Guest</div>
    </div>
    <div class="hero-switch">
      <select id="selPlayer" onchange="if(this.value&&typeof loadPlayer==='function'){loadPlayer(this.value)}">
        <option value="">Choose a player</option>
      </select>
      <button class="btn-ghost btn-small" onclick="if(typeof openModal==='function')openModal()">+ New</button>
    </div>
    <div class="hero-xp">
      <div class="xp-bar"><div class="xp-fill" id="xpBar" style="width:0%"></div></div>
      <div class="xp-text" id="xpText"><span id="xpNow">0</span> pts · Next: <span id="xpGoal">100</span> pts</div>
    </div>
  </header>
  
  <!-- Bento grid (stats rapides) -->
  <div class="bento-grid">
    <div class="bento-tile"><div class="bento-num" id="b1">1</div><div class="bento-label">Level</div></div>
    <div class="bento-tile"><div class="bento-num" id="b2">0</div><div class="bento-label">Points</div></div>
    <div class="bento-tile"><div class="bento-num" id="b3">0/20</div><div class="bento-label">Done</div></div>
  </div>
  
  <!-- Main dashboard content -->
  <main class="dashboard-main">
    <!-- Section 1: My Life in France (Life Skills) -->
    <section class="dash-section" id="dash-life">
      <h2 class="dash-title">🇫🇷 My Life in France</h2>
      <div id="lifeSkillsGrid" class="life-skills-grid"></div>
    </section>
    
    <!-- Section 2: Journey (levels map) -->
    <section class="dash-section" id="dash-levels">
      <h2 class="dash-title">🗺️ Journey</h2>
      <div id="journeyMap" class="journey-map"></div>
    </section>
    
    <!-- Section 3: Badges -->
    <section class="dash-section" id="dash-badges">
      <h2 class="dash-title">🏅 Badges</h2>
      <div id="badgesGrid" class="badges-grid"></div>
    </section>
    
    <!-- Section 4: Cameleon (adaptive help) -->
    <section class="dash-section" id="dash-cameleon">
      <h2 class="dash-title">🦎 Cameleon</h2>
      <div id="cameleonStage" class="cameleon-stage"></div>
    </section>
    
    <!-- Section 5: History (sessions) -->
    <section class="dash-section" id="dash-history">
      <h2 class="dash-title">📜 History</h2>
      <div id="historyList" class="history-list"></div>
    </section>
    
    <!-- Section 6: Mon Génie (personal word collection) -->
    <section class="dash-section" id="dash-genius">
      <h2 class="dash-title">🪔 Mon Génie</h2>
      <div id="geniusPanel" class="genius-panel"></div>
    </section>
  </main>

  <!-- ✅ ORDRE CORRECT DES SCRIPTS -->
  <!-- 1. config.js — Configuration globale -->
  <script src="js/config.js"></script>
  
  <!-- 2. core.js — Moteur central (Storage, PlayerManager, I18n, Theme, DirectionMode, Modal, Toast, Router, EventBus) -->
  <script src="js/core.js"></script>
  
  <!-- 3. ui-utils.js — Utilitaires UI (toast, modal) -->
  <script src="js/ui-utils.js"></script>
  
  <!-- 4. life-skills-data.js — Données Life Skills (My Life in France) -->
  <script src="js/life-skills-data.js"></script>
  
  <!-- 5. data-loader.js — Charge les 20 leçons depuis lessons/ et construit LESSONS_DATA + QUESTIONS_DB -->
  <script src="js/data-loader.js"></script>
  
  <!-- 6. vocabulary-data.js — Charge les 21 niveaux de vocabulaire (592/818 mots) -->
  <script src="js/vocabulary-data.js"></script>
  
  <!-- 7. vocabulary-engine.js — Moteur du vocabulaire -->
  <script src="js/vocabulary-engine.js"></script>
  
  <!-- 8. emergency-data.js — Données SOS (emergency) -->
  <script src="js/emergency-data.js"></script>
  
  <!-- 9. conversation-data.js — Données dialogues (conversation) -->
  <script src="js/conversation-data.js"></script>
  
  <!-- 10. dashboard.js — Logique du dashboard (renderJourneyMap, renderLifeSkills, etc.) -->
  <script src="js/dashboard.js"></script>
  
  <!-- 11. nav.js — Navigation entre pages (lié à settings.html) -->
  <script src="js/nav.js"></script>

  <!-- Scripts inline pour Settings -->
    <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (typeof initDashboard === 'function') initDashboard();
    });
  </script>

  
  


</body>
</html>
