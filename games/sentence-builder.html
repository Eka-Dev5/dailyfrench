<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Daily French 🥖 — Phrase Builder 🧩</title>
  <script src="../js/theme-loader.js"></script>
  <link rel="stylesheet" href="../css/base.css">
  <script src="../js/nav.js"></script>
  <style>
    .phrase-container{max-width:900px;margin:0 auto;padding:var(--space-md)}
    .phrase-header{text-align:center;margin-bottom:var(--space-lg)}
    .phrase-header h1{font-size:var(--font-xl);font-weight:800;color:var(--primary)}
    .phrase-header p{color:var(--muted);font-size:var(--font-sm)}
    .mission-box{background:var(--primary-light);border-radius:var(--r);padding:var(--space-lg);margin-bottom:var(--space-lg);text-align:center}
    .mission-emoji{font-size:2.5em;margin-bottom:var(--space-sm)}
    .mission-text{font-size:var(--font-md);font-weight:700;color:var(--text)}
    .mission-hint{color:var(--muted);font-size:var(--font-sm);font-style:italic}
    .blocks-pool{display:flex;flex-wrap:wrap;gap:var(--space-sm);margin-bottom:var(--space-lg);min-height:60px;padding:var(--space-md);background:var(--bg-card);border-radius:var(--r);border:2px dashed var(--border)}
    .block{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;background:var(--white);border:2px solid var(--primary);border-radius:var(--r-sm);font-weight:700;color:var(--text);cursor:grab;transition:all .2s;user-select:none}
    .drop-zone{display:flex;flex-wrap:wrap;gap:var(--space-sm);min-height:70px;padding:var(--space-md);background:var(--white);border:3px dashed var(--border);border-radius:var(--r);align-items:center;justify-content:center;margin-bottom:var(--space-lg)}
    .slot{display:inline-flex;align-items:center;justify-content:center;min-width:80px;min-height:50px;padding:10px 16px;background:var(--bg-card);border:2px dashed var(--border);border-radius:var(--r-sm)}
    .slot.filled{border-style:solid;border-color:var(--primary);background:var(--white)}
    .controls{display:flex;gap:var(--space-sm);justify-content:center;flex-wrap:wrap;margin-bottom:var(--space-md)}
    .score-board{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-sm);margin-bottom:var(--space-lg)}
    .score-item{background:var(--bg-card);border-radius:var(--r);padding:var(--space-sm);text-align:center}
    .score-num{font-size:var(--font-xl);font-weight:800;color:var(--primary)}
    .score-label{font-size:var(--font-xs);color:var(--muted);text-transform:uppercase}
    .level-select{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:var(--space-lg);padding:var(--space-md);background:var(--bg-card);border-radius:var(--r)}
    .lvl-btn{padding:10px 16px;border:2px solid var(--border);background:var(--white);border-radius:var(--r-sm);cursor:pointer;font-weight:700;font-size:var(--font-sm);transition:all .2s}
    .lvl-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
    .lvl-btn.locked{opacity:.4;cursor:not-allowed}
  </style>
</head>
<body>
  <div id="toast" class="toast"></div>
  <div id="modalWrap" class="modal-wrap">
    <div class="modal">
      <h3 id="modalTitle">New Player</h3>
      <input type="text" id="mInput" maxlength="30" placeholder="Your name" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">
      <div class="modal-actions">
        <button id="btnCancelModal" class="btn-ghost" onclick="closeModal()">Cancel</button>
        <button id="btnCreatePlayer" class="btn-primary" onclick="confirmNewPlayer()">Create</button>
      </div>
    </div>
  </div>
  <header class="hero">
    <div class="hero-avatar" id="heroAv">🧩<span class="hero-lvl-badge" id="heroLvl">1</span></div>
    <div class="hero-info"><div class="hero-name" id="heroName">Guest</div></div>
    <div class="hero-xp">
      <div class="xp-bar"><div class="xp-fill" id="xpBar" style="width:0%"></div></div>
      <div class="xp-text" id="xpText"><span id="xpNow">0</span> pts · Next: <span id="xpGoal">100</span> pts</div>
    </div>
    <div class="hero-switch">
      <select id="selPlayer" onchange="if(this.value&&typeof loadPlayer==='function'){loadPlayer(this.value)}"><option value="">Choose a player</option></select>
      <button class="btn-ghost btn-small" onclick="if(typeof openModal==='function')openModal()">+ New</button>
    </div>
  </header>
  <div class="bento-grid">
    <div class="bento-tile"><div class="bento-num" id="b1">1</div><div class="bento-label">Level</div></div>
    <div class="bento-tile"><div class="bento-num" id="b2">0</div><div class="bento-label">Points</div></div>
    <div class="bento-tile"><div class="bento-num" id="b3">0/20</div><div class="bento-label">Done</div></div>
  </div>
  <div class="phrase-container">
    <div class="phrase-header"><h1>🧩 Phrase Builder</h1><p>Drag blocks • Build sentences • Learn grammar by doing</p></div>
    <div class="score-board">
      <div class="score-item"><div class="score-num" id="scoreTotal">0</div><div class="score-label">Points</div></div>
      <div class="score-item"><div class="score-num" id="scoreStreak">0</div><div class="score-label">Streak 🔥</div></div>
      <div class="score-item"><div class="score-num" id="scoreCompleted">0</div><div class="score-label">Phrases</div></div>
    </div>
    <div class="level-select" id="levelSelect"></div>
    <div class="mission-box" id="missionBox">
      <div class="mission-emoji" id="missionEmoji">🎯</div>
      <div class="mission-text" id="missionText">Loading...</div>
      <div class="mission-hint" id="missionHint"></div>
    </div>
    <div class="blocks-pool" id="blocksPool"></div>
    <div class="drop-zone" id="dropZone"><span style="color:var(--muted);font-style:italic">👇 Drag blocks here to build your phrase</span></div>
    <div class="controls">
      <button class="btn btn-primary" onclick="checkPhrase()">✓ Check</button>
      <button class="btn btn-ghost" onclick="clearPhrase()">✕ Clear</button>
      <button class="btn btn-secondary" onclick="showHint()">💡 Hint</button>
      <button class="btn btn-ghost" onclick="speakPhrase()">🔊 Listen</button>
    </div>
    <div class="feedback" id="feedback" style="display:none"></div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/core.js"></script>
  <script src="../js/ui-utils.js"></script>
  <script src="js/sentence-builder.js"></script>
</body>
</html>
